services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: nivorae
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Uncomment to enable Redis locally. Pair with REDIS_URL=redis://localhost:6379
  # in backend/.env.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redisdata:/data

volumes:
  pgdata:
  # redisdata:
